<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>DSH 工作图标 · H2 等离云核</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;
    -webkit-user-select:none;user-select:none;cursor:default}
  body.bg-dark{background:#111111}
  body.bg-white{background:#ffffff}

  /* ===== 底板深浅档 + 配套文字档（2026-09-19；用户要求「我希望这个底更浅」）=====
     为什么"底"和"字色"必须一起分档：底变浅 ⇒ 白字的对比度直接往下掉。
     每一档的文字色都用**像素口径**重新配过（tests/panel-lightness.mjs：笔画像素 vs 按实测 alpha
     合成到用户真实壁纸之后的底），门槛是每档最差的一条 ≥4.5:1（小字）。
     口径与约束（一条都不许丢）：
       · 档位只改**底板的四段渐变 RGB**与**承载文字的颜色**；α 仍**只**由主进程的
         `--panel-alpha` 控制（窗口侧不写死透明度，window.panelAlpha 的语义不变）。
       · 分区色的**图形档一个字节都不动**（圆点 #56d9c8 / 刻度 / 竖条 / 描边 / `.sec` 边框），
         用户口径「区分色可以保留」——变浅时只把**当文字用的**分区色按色相不变、只提亮度处理。
       · `#p0..p3` 是 "r,g,b" 三元组，供 `rgba(var(--pN), α)` 文本代入。
     档位由渲染层加在 <body> 上（`body.plate-a|b|c`）；生产默认档见 JS 常量 PLATE_TIER，
     取证通道是既有的 `--bg`：`--bg plate-a|plate-b|plate-c`（生产路径永不出现）。 */
  body{--p0:24,41,63;--p1:18,33,52;--p2:15,28,44;--p3:11,21,33;
    --ink:#dbe6f2;--ink2:#e8f0fa;--ink3:#eef4fa;--ink4:#e6eefa;--ink5:#f4f8fa;--act:#7fe3c8;--met:#9ad4ff}
  /* 档 a：只把"下半的深"拉平（顶部几乎不动），字色只微提一档 —— 改动最小的一档 */
  body.plate-a{--p0:26,42,62;--p1:23,38,57;--p2:21,35,53;--p3:19,32,47;
    --ink:#e8f0fa;--ink2:#eef4fa;--ink3:#f2f6fb;--ink4:#eef4fa;--ink5:#f6fafd;--act:#9deed6;--met:#b8dfff}
  /* 档 b：整体提一档并拉平（浅色壁纸下明显更浅），字色提一档 */
  body.plate-b{--p0:36,55,80;--p1:33,51,75;--p2:31,48,71;--p3:29,45,66;
    --ink:#eef4fa;--ink2:#f4f8fc;--ink3:#f7fbff;--ink4:#f2f6fb;--ink5:#f8fbfd;--act:#b6f4e4;--met:#cfe9ff}
  /* 档 c：最浅（底接近"石板蓝"）。到这档文字必须近白，分区色的**身份靠图形档保留**（边框/圆点/刻度不变） */
  body.plate-c{--p0:44,66,94;--p1:40,60,87;--p2:38,57,83;--p3:36,54,78;
    --ink:#f6fafd;--ink2:#f8fbfe;--ink3:#fafdff;--ink4:#f6fafd;--ink5:#fbfdff;--act:#c9f9ec;--met:#e0f2ff}

  /* ===== 窗口侧主题（可调量）—— 2026-09-19 任务 F =====
     落盘在**窗口侧自己的文件** `~/.dsh/work-icon/theme.json`（**绝不写宿主的 config.json**：
     本项目踩过"窗口侧把宿主配置文件覆盖掉、把用户勾选态清空"的坑，两个真相源不许混）。
     这五个量由右键菜单「配色设置…」打开的独立设置窗口驱动，走**同一个 Electron 实例的 IPC**实时下发，
     不经 DSH 宿主的 stdio 协议（那条路上有宿主自己的持久化与回写逻辑，会跟这里打架）。
     默认值 = 用户当前看到的形态（悬浮板底色 α=0 = 全删；大面板 α=0.78 = 保留）。 */
  body{--hover-plate-a:0;        /* 悬浮信息板底色深浅：0 = 无底无框（默认） */
       --panel-opacity:1;        /* 大面板整体不透明度 */
       --text-boost:1;           /* 文字亮度（filter:brightness；1 = 不改） */
       --icon-bright:1}          /* 图标亮度（1 = 不改） */
  /* 以下几档只在**真的调过**（body.tuned）时挂上：默认路径一个字节都不变（黄金样本/取色口径不受影响） */
  /* ⚠️ `#v2panel {` 的 `{` 前**故意留一个空格**：tests/v2.mjs 的 W7 用文本匹配 `/#v2panel\{[^}]*/` 取
     "`#v2panel` 那条规则"，不留空格的话它会先命中这里（本条规则里没有 z-index）⇒ 假红。
     规则语义一个字没变，只是不让文本匹配误伤。 */
  body.tuned #plateInner,body.tuned #v2panel {filter:brightness(var(--text-boost,1))}
  body.tuned #v2hover .st,body.tuned #v2hover .h3,body.tuned #v2hover .bl{filter:brightness(var(--text-boost,1))}
  body.tuned #zoom{filter:brightness(var(--icon-bright,1))}

  /* ===== SPEC 第 4 节 七态配色（逐项照抄，不得优化） ===== */
  .st-IDLE        {--c1:#3d7688;--c2:#1b3b47;--glow:rgba(80,190,220,.20);--core:.13}
  .st-THINKING    {--c1:#38e8ff;--c2:#176c85;--glow:rgba(56,232,255,.55);--core:.42}
  .st-WORKING     {--c1:#5cffd0;--c2:#128f78;--glow:rgba(92,255,208,.62);--core:1}
  .st-WAITING     {--c1:#ffb340;--c2:#a35a08;--glow:rgba(255,179,64,.62);--core:.55}
  .st-SUCCESS     {--c1:#8dffae;--c2:#1f9b5a;--glow:rgba(141,255,174,.55);--core:1}
  .st-ERROR       {--c1:#ff4d6d;--c2:#8e0f2a;--glow:rgba(255,77,109,.62);--core:.7}
  .st-DISCONNECTED{--c1:#5a636e;--c2:#2b3138;--glow:rgba(140,150,160,.16);--core:.2}

  /* ===== 布局 ===== */
  /* 关闭态/截图态：整窗居中 —— 与改动前逐像素一致（黄金样本、旋转取证都吃这条）
     面板展开时才切到"钉在顶部图标区"的布局，否则图标会跟着变高的窗口一起居中跑掉 */
  #stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  body.panel-open #stage{inset:auto;left:0;right:0;top:0;height:var(--icon-win,210px)}
  #zoom{transition:transform 150ms ease-out;transform-origin:50% 50%}
  #stage.hot #zoom{transform:scale(1.06)}
  #shk{display:block}
  #ico{display:block;transition:filter 300ms linear}
  /* ===== 图标下的两行文字（2026-09-19 用户拍板）=====
     第 1 行 #lab ：状态 · 活动 · 词元（原样，只是位置上移了 8px，见下）
     第 2 行 #lab2：代理指标「轮数 · 工具数」—— 用户原话「换到图标下面那行青色文字的下面」，
                   从悬浮层 #v2hover 里**搬过来**（不是复制：那边已删除），**样式沿用 #lab**。
     为什么要动 #lab 的 top（-20px → -28px）：hot 时图标 `#zoom` 是 scale(1.06)，
     实测下沿 181.3px，而窗口（`--icon-win`）只有 210px ⇒ 图标下只剩 ~29px，
     两行 12.5px 必须挤在 181.4~210 之间，不动 #lab 就会把第二行顶到窗口外被裁掉
     （本项目踩过"内容被窗口裁切"的坑：#v2hover 实测 288px 宽而窗口只有 210 ⇒ 右侧被裁 78px）。
     两行共用同一个声明块 ⇒ 字体/字号/颜色/阴影/透明度**逐属性相同**，不存在"另配一套样式"。 */
  #lab,#lab2{position:absolute;left:0;right:0;text-align:center;white-space:nowrap;
    font:400 10px/1.25 ui-monospace,Consolas,"Courier New",monospace;
    color:var(--c1,#cfe4ee);opacity:0;transition:opacity 140ms linear;
    text-shadow:0 0 4px rgba(0,0,0,.85),0 1px 2px rgba(0,0,0,.9)}
  #lab{top:calc(var(--icon-win,210px) - 28px)}
  #lab2{top:calc(var(--icon-win,210px) - 15.5px)}
  #stage.hot #lab,#stage.hot #lab2{opacity:.92}
  /* 互斥：完整面板开着时，悬停**不再**显示轻量面板（内容会打架） */
  body.panel-open #lab,body.panel-open #lab2{opacity:0 !important}
  body.panel-open #stage.hot #zoom{transform:none}
  body.shot #lab,body.shot #lab2{display:none}

  /* ===== 完整面板（③-2 定稿：440 宽 / 底板 α 可调；本轮 α 由主进程 PANEL_ALPHA 下发）=====
     ① 底读作"深蓝"而非"发蓝的黑"：四段渐变 + 网格 + 斜向高光 + 顶部内高光
     ② 文字一律不发光（无 text-shadow / 无 drop-shadow），靠色相与清晰度区分
     ③ 青只是 5 个分区色之一（青=动作 / 金=花费 / 淡蓝=度量 / 紫=任务 / 冷灰=思考） */
  #panel{position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity 120ms linear,visibility 0s linear 120ms}
  /* 面板打开时**必须**能被鼠标点到（用户 2026-09-13 拍板：面板是可交互的，要能拖右侧滚动条）。
     窗口侧同时把命中判据从"只有图标圆"扩到"图标圆 ∪ 面板可见矩形"；
     两处缺一不可：主进程不开窗，事件进不来；这里不开 pointer-events，事件进来了也不落到滚动条上。
     收起时保持 none ⇒ 收起态行为一个字节不变。 */
  body.panel-open #panel{opacity:var(--panel-opacity,1);visibility:visible;pointer-events:auto;transition:opacity 120ms linear,visibility 0s linear 0s}
  #plate{position:absolute;left:0;top:var(--panel-top,185px);width:var(--panel-w,440px);height:var(--panel-h,340px);
    overflow:hidden;border-radius:5px;border:1px solid #4a7fa8;
    background:linear-gradient(168deg,
      rgba(var(--p0),calc(var(--panel-alpha,0.78) + 0.02)) 0%,
      rgba(var(--p1),var(--panel-alpha,0.78)) 38%,
      rgba(var(--p2),var(--panel-alpha,0.78)) 66%,
      rgba(var(--p3),calc(var(--panel-alpha,0.78) + 0.01)) 100%);
    box-shadow:0 20px 46px rgba(3,8,16,.62), inset 0 1px 0 rgba(190,220,245,.13)}
  #plate .pg{position:absolute;left:0;top:0}
  #plate .sheen{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(118deg,rgba(190,220,245,.075) 0%,rgba(190,220,245,.02) 34%,rgba(190,220,245,0) 55%)}
  #plate .scan{position:absolute;left:0;right:0;top:38%;height:34px;pointer-events:none;
    background:linear-gradient(90deg,rgba(190,220,245,0),rgba(190,220,245,.055) 45%,rgba(190,220,245,.02) 62%,rgba(190,220,245,0))}
  #pIn{position:relative;padding:13px 26px 12px}
  .ph{height:13px;line-height:13px}
  .kick{font:400 8.5px/1 ui-monospace,Consolas,monospace;letter-spacing:1.5px;color:var(--ink)}
  .he{float:right;font:400 9px/1 ui-monospace,Consolas,monospace;color:var(--ink4)}
  .live i{display:inline-block;width:3.4px;height:3.4px;border-radius:50%;background:#56d9c8;margin-right:2.4px;opacity:.4}
  .live i:nth-child(2){opacity:.7}.live i:nth-child(3){opacity:1}
  .sec{border-left:2px solid;padding-left:9px;margin:7px 0 0}
  .sh{height:13px;line-height:13px}
  .sl{font:400 8.5px/1 ui-monospace,Consolas,monospace;letter-spacing:1.3px}
  .sr{float:right;font:400 8.5px/1 ui-monospace,Consolas,monospace;color:var(--ink)}
  .t1{font-size:12.5px;color:var(--ink2);font-weight:700}
  .tl{font:400 10px/15px system-ui,"Microsoft YaHei",sans-serif;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tl.d{color:var(--ink)}
  .tstrip{height:12px;line-height:12px}
  .tstrip svg{vertical-align:-1px}
  .slab{font:400 8px/1 ui-monospace,Consolas,monospace;color:var(--ink);margin-left:8px}
  .costrow{position:relative;height:34px;line-height:34px}
  .cur{font-size:14px;vertical-align:6px;margin-right:3px}
  .cnum{font:400 27px/1 ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:.4px}
  .cdelta{font:400 9.5px/1 ui-monospace,Consolas,monospace;color:#ffc266;margin-left:9px}
  .costrow svg{position:absolute;right:0;top:6px}
  .tkrow{height:12px;line-height:12px}
  .mrow{height:52px;line-height:52px;margin-top:6px}
  .cw{display:inline-block;vertical-align:middle;margin-right:12px}
  .cwlab{font:400 8.5px/12px ui-monospace,Consolas,monospace;color:var(--ink);font-weight:400;vertical-align:middle}
  .mgrid{display:inline-grid;vertical-align:middle;gap:2px 12px;width:auto}
  .mt{display:block;white-space:nowrap;line-height:13px}
  .mt.l{display:inline-block;vertical-align:middle;margin-left:12px}
  .ml{font:400 8px/1 ui-monospace,Consolas,monospace;color:var(--ink);margin-right:4px}
  .mv{font:400 10.5px/1 ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
  .mu{font:400 8px/1 ui-monospace,Consolas,monospace;color:var(--ink);margin-left:2px;font-style:normal}
  .mt svg{vertical-align:-1px;margin-left:5px}
  .tgrid{display:grid;gap:0 16px}
  .tr{position:relative;height:14px;line-height:14px;font-size:9.5px;white-space:nowrap;overflow:hidden}
  .tr svg{position:absolute;right:0;top:5px}
  .ix{display:inline-block;width:19px;font:400 8.5px/1 ui-monospace,Consolas,monospace;color:var(--ink)}
  .mk{display:inline-block;width:14px;font-size:9px;color:var(--ink)}
  .tt{color:var(--ink)}
  .tr.done .tt{color:var(--ink)}.tr.done .mk{color:#b79cff}.tr.doing .tt{color:var(--ink3)}.tr.doing .mk{color:#ffc266}
  #leads{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
  .leL{font:400 8.5px/1 ui-monospace,Consolas,monospace;letter-spacing:.9px}
  .leV{font:400 12px/1 ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
  .leU{font-size:8.5px;opacity:.75}
  body.shot:not(.panel-open) #panel{display:none}   /* 截图模式默认不画面板（黄金样本/旋转取证）；--shot-panel 验收时才画 */

  /* ===== 动效全部由 JS 逐帧驱动（SPEC 第 8 节第 4 款）=====
     这里刻意**不留任何无限 CSS 动画**：CSS 无限动画会让合成器按显示器刷新率（本机 120Hz）持续跑，
     是空闲 CPU 降不下来的主因。旋转 / 呼吸 / 抖动 / 一次性动效都在下面的 JS 驱动里按状态帧率预算跑。
     只保留两处**有限时长**的过渡（300ms 交叉淡入、150ms 粒子揭示），它们一次性结束，不是稳态开销。 */
  /* 旋转层单独成合成层：旋转/半径波动只动合成器，不触发整棵 SVG 重绘（静态层不再每帧跟着重画）。
     2026-09-19：粒子从"一整个 .cloud"改成 .cloud 里的 4 条 .lane —— 每道一个合成层（共 4 层，
     省电档下 0 层），仍然只有 transform，没有逐帧几何重算。
     ⚠️ `will-change` 只给**当前可见的那一层**的 .lane（`.layer.on`）：7 个状态层 × 4 车道 = 28 个
     提升层会实打实抬高空闲 CPU（实测 IDLE +4.2 个百分点，只留 4 个之后回到基线量级）。 */
  .cloud,.lane{transform-origin:50% 50%;transform-box:view-box}
  .layer.on > .cloud,.layer.on .lane{will-change:transform}
  .seg{will-change:transform;transform-origin:50% 50%;transform-box:view-box}
  body[data-freeze="1"] .cloud,body[data-freeze="1"] .lane,body[data-freeze="1"] .seg,
  body[data-freeze="1"] .layer.on > .cloud,body[data-freeze="1"] .layer.on .lane{will-change:auto}
  /* 核心（L7）与静态层不参与旋转：显式钉住，防止以后被误加 */
  .core{transform:none}
  .layer{opacity:0;visibility:hidden;transition:opacity 300ms linear,visibility 0s linear 300ms}
  .layer.on{opacity:1;visibility:visible;transition:opacity 300ms linear,visibility 0s linear 0s}
  @keyframes pgIn{from{opacity:0}}
  #flash{opacity:0}
  .glowA{filter:url(#soft2)}
  .glowB{display:none}
  .layer.st-WAITING .glowA{filter:url(#soft2b)}
  .layer.st-WAITING .glowB{display:inline;filter:url(#soft4b)}

  /* ===== 冻结模式（黄金样本像素比对）：一次性动画停在 0% 关键帧，相位与 t=0 同 ===== */
  body[data-freeze="1"] *,body[data-freeze="1"] *::before,body[data-freeze="1"] *::after{
    animation-play-state:paused !important;transition:none !important}
  /* 旋转在 t=0 是恒等变换，但"带变换"与"不带变换"的光栅化会差一点点 —— 冻结时干脆不挂变换 */
</style>

<style id="v2css">
/* ===== v2：C-130J HUD 手法（单色 + 描边 + 刻度带），文字不发光 ===== */
#v2hover{position:absolute;left:0;top:0;z-index:40;   /* 必须在环/粒子之上：文字不许被弧或粒子穿过 */
  width:190px;padding:5px 7px;display:none;
  pointer-events:none;font-family:ui-monospace,Consolas,monospace;
  border-radius:calc(var(--hover-plate-a,0) * 5.3192px)}   /* 0.94 档 → 5.00px（= 改动前那一版的圆角） */
/* ===== 悬浮信息板的「底」—— 2026-09-19 用户拍板「把这个图2的黑框全删了」 =====
   改动前（原文，两行）：
     #v2hover.plate{background:rgba(11,22,36,.94);border:1px solid rgba(74,127,168,.85)}
     #v2hover 里还有 border-radius:5px
   现在：**底 α / 边框宽 / 边框色 α / 圆角** 四条全部由**同一个可调量** `--hover-plate-a` 派生。
      · `--hover-plate-a` = 0（**默认**）⇒ 底 α=0、边框宽=0、圆角=0 —— 一点底都不留，内容直接浮在桌面上；
      · 调到 0.94 ⇒ 逐条还原成改动前那一版（底 rgba(11,22,36,.94)、1px 边框 α≈.85、5px 圆角）。
   为什么做成"可调量=0"而不是把代码删掉：右键菜单「配色设置…」打开的设置窗口要能**实时**把它调回去，
   所以这几条必须留在一个可被 IPC 改写的变量上（默认值就是"全删"）。
   注：用户提到的「四段渐变 / 22px 网格 / 斜高光」**不在这一块上** —— 那三样是**下方展开的大面板**
   `#plate` / `#plateBg` / `.sheen` / `.scan` 的底；本块（#v2hover）只有"单色底 + 1px 框 + 圆角"。
   大面板的底本轮**一字未动**（用户明确要求别动它），它自己的深浅仍由 `--panel-alpha` 控制。 */
#v2hover.plate{
  background:rgba(11,22,36,var(--hover-plate-a,0));
  border:calc(var(--hover-plate-a,0) * 1.064px) solid rgba(74,127,168,calc(var(--hover-plate-a,0) * .904))}
#v2hover.noplate{background:transparent;border:0}
#v2hover .r1{height:15px;line-height:15px;white-space:nowrap}
/* ===== 对比度定案（2026-09-13）：
   用户真实壁纸是**浅色**（天空+水面，实测 RGB 均值 ≈ rgb(119,157,165)），
   半透明黑板（α .78）叠上去之后的**有效背景**是 rgb(≈40,≈58,≈74) —— 属于"中低明度"，
   而原先的 #92aac0 / #9db6cc / #8fa8bd / #a8bdd2 这一族冷灰（明度 0.30~0.50）在这种底上
   只有 4.1~5.7:1，8~9px 小字下**糊成一片**（用户原话：下面的都看不清）。
   纪律：① 正文/数值一律提到白或近白；② 5 个分区色的**图形档一个字节都不动**（青#56d9c8 金#ffc266
   淡蓝#6fb6ff 紫#b79cff 冷灰#9fb0c4）—— 用户口径「区分色可以保留」，圆点/刻度/竖条/描边/分区色边框
   全部保持原值；只有**当文字色用**的两档按用户拍板提亮（青(动作)文字 #56d9c8→#7fe3c8、
   淡蓝(度量数值)文字 #6fb6ff→#9ad4ff，**色相不变只提亮度**，见 PC 下方的 PTEXT）；
   ③ 「不适用/空」不再靠"暗到看不清"表达，改用 —— 与更亮的灰蓝。
   ✅ 已解决（2026-09-13 第二轮，用户拍板"提亮到达标"）：原先青(动作) 4.41:1、淡蓝(度量) 3.56:1
      低于小字 4.5:1 门槛；提亮后由 PTEXT 文字档解决（青→#7fe3c8、淡蓝→#9ad4ff），
      金/紫/冷灰原值即达标。**图形档保持原值** ⇒ 圆点/刻度/竖条/描边/.sec 边框颜色真的没变。
      tests/v2.mjs ⑨ 已把分区色纳入硬断言，并做过"改回旧值 ⇒ 必红"的反证。
   用户原话：「写出来了，但是这个字的颜色对比度太低了，你可以把字改成白的」「区分色可以保留」。
   ★ 整族横扫：凡是承载文字的颜色都在这里定档，不留下"漏了某一条"的同类项。 */
#v2panel .sh,#v2panel .mt,#v2panel .v2sec,#v2panel .na,#v2hover .st{font-size:12.5px;font-weight:700;color:var(--ink5)}
/* ===== 代理指标行（2026-09-19：第一版在悬浮层，用户第二轮拍板**搬到 #lab 下方**）=====
   第一版原话：「刻度尺保留轮数和工具数，只保留文字，像这个图片一样加在这行文字下面」
   ⇒ ① 那一行**刻度尺图形整个删掉**（连同 `.v2ruler` 的 CSS 与生成 `<i>` 刻度的循环）；
      ② 「轮数 / 工具数」只留**文字**。
   第二轮原话：「**换到图标下面那行青色文字的下面**」⇒ 形态从"悬浮层活动行下面"改为
   "`#lab`（图标下的青色状态行）正下方"，**样式改为沿用 `#lab`**（见上方 `#lab,#lab2` 那个块），
   **并且从悬浮层里搬走**（`.tok2` 连同它的规则一起删除，不是复制）。
   原则不变：代理指标（轮/步/工具数/耗时）**无分母 ⇒ 不许画成条/百分比**；
   有分母的**计划进度**仍由 `.v2bullet` 表达 —— ⚠️ **2026-09-21 任务 C 起默认不画那根条**
   （用户原话「我这个左上角的任务条也不要了，有环形的这样是多此一举」），
   但这条"无分母不许画条"的纪律照旧成立（`hoverBar='on'` 时那根条会原样回来）。 */
/* ===== 「全删底」时的文字补偿（描边 + 阴影），2026-09-19 =====
   底没了，那层深底原先扛着的对比度也就没了（实测：深底 α.94 时文字对底 4.5:1 以上）。
   所以文字必须**自己造出边界**：`-webkit-text-stroke` + `paint-order:stroke fill` 给每个字形描一圈深边，
   再叠两层深阴影兜住"字缝里的亮壁纸"。
   命中条件有两条，都指向"文字底下没有板"：
     · `#v2hover.noplate` —— window.hoverPlate=off（老开关，保留）；
     · `#v2hover.hp-nobg` —— **本轮新增**：由渲染层按 `--hover-plate-a` 判定（≤0.35 视为没有底），
       即"同一个可调量"既管底、也管补偿 —— 调大底色时补偿自动退掉，不会出现"有底又描边"的双重痕迹。
   描边参数（2.2px→3px、阴影 3px→4px）是**实测调出来的**，口径与数字见 tests/hover-plate.mjs
   （像素口径：把窗口像素按实测 α 合成到用户真实浅色壁纸上再算 WCAG）。 */
#v2hover.noplate .st,#v2hover.noplate .h3,#v2hover.noplate .bl,
#v2hover.hp-nobg .st,#v2hover.hp-nobg .h3,#v2hover.hp-nobg .bl{
  -webkit-text-stroke:3px rgba(3,8,16,.96);paint-order:stroke fill;
  text-shadow:0 0 4px rgba(2,6,12,.98),0 1px 2px rgba(2,6,12,1),0 -1px 2px rgba(2,6,12,1)}
#v2panel .v2sec{margin-top:6px}
/* 空状态：居中块，底边留足行距，避免下半部整块空白 */
#plateInner .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;height:calc(var(--panel-h,340px) - 46px);min-height:150px}
#plateInner .ebig{font-size:13px;color:var(--ink3);letter-spacing:.5px}
#plateInner .esub{font-size:10.5px;color:var(--ink)}
#plateInner .esub2{font-size:10px;color:var(--ink);margin-top:2px}
#plateInner .eline{width:150px;height:1px;background:rgba(157,196,230,.22);margin:5px 0}
/* 顶部小字提亮到 AA（原 #92aac0 在小字号下不足）；本轮再提一档：8~9px 小字一律近白 */
#plateInner .ph2,#plateInner .kick{color:var(--ink)}
#plateInner .he{color:var(--ink4)}
#plateInner .sh{color:var(--ink2)}
#plateInner .sec{margin-bottom:9px}
#plateInner .sec .sh{margin-bottom:5px}   /* 段标题与正文留出行距（原 3px 会相交） */
#v2panel .sh{font:400 9px/1.25 ui-monospace,Consolas,"Microsoft YaHei",sans-serif;color:var(--ink3);letter-spacing:.6px;margin-bottom:3px}

#v2panel .mt.na{color:var(--ink4)}
#v2panel .trow2{height:15px;line-height:15px;font-size:10px;color:var(--ink);white-space:nowrap;overflow:hidden}
#v2panel .trow2.d1{padding-left:10px}
#v2panel .trow2.d2{padding-left:20px}
#v2panel .trow2 .tw{color:var(--ink3);font-family:ui-monospace,Consolas,monospace}
#v2panel .trow2 .mk{margin-right:5px}
#v2panel .trow2 .mk.done{color:#7fe3c8}
#v2panel .trow2 .mk.run{color:#56d9c8}
#v2panel .trow2 .mk.wait{color:var(--ink)}
#v2panel .fold{height:14px;line-height:14px;font:400 8.5px/14px ui-monospace,Consolas,monospace;color:var(--ink)}
#v2panel .tx{font-size:10px;line-height:15px;color:var(--ink);white-space:nowrap;overflow:hidden}
#v2panel .tx.dim2{color:var(--ink2)}
/* 子弹图：区间底 + 实际值 + 上限竖线 */
.v2bullet{position:relative;display:block;height:13px}
.v2bullet .bq{position:absolute;left:0;top:3px;height:6px;background:rgba(232,244,252,.2);border-radius:1px}

/* 完成相位：收束 → 爆散 → 回归。**只用 transition，一次性由 JS 切换类**（无常驻 @keyframes）。 */

.warnv2{color:#ffc266}
/* ===== 面板 v2 ===== */
/* ★★ 2026-09-13 第三轮根因（用户报「红笔那一块全是灰的根本看不清」）：
   病灶不在颜色，在**层叠**。#v2panel（下方第 250 行）与 #panel（第 251 行）都是
   position:absolute 且 z-index:auto ⇒ 按 DOM 顺序绘制 ⇒ **后出现的 #panel/#plate 画在
   #v2panel 之上**，黑板那层 rgba(…,.78) 的深蓝渐变就整个盖在 v2 段的文字上，
   把每个字形压到名义色的 ~22%（#dbe6f2 → 实测 rgb(64,77,93)）。
   实测（浅色壁纸，880×1050 device，dpr=2）：
     · 上半截（#plateInner 内，**在黑板之上**）笔画像素 = 名义色本身 → 8.2~13.6:1 ✓
     · 下半截（#v2panel 内，**被黑板盖住**）      → 1.18~2.13:1 ✗（用户看到的"灰"）
   旧口径只量 getComputedStyle().color（两边都合格）⇒ 看不到这一层，这就是漏网之鱼。
   修法：#v2panel 抬到黑板之上（#v2hover 用 40，这里取 30，仍低于悬浮层）。
   #v2panel 自身**没有 background**（L1540 的口径注释），所以抬起来只抬文字，不挡环/引线。 */
#v2panel{display:none;color:var(--ink);position:absolute;z-index:30;left:0;top:calc(var(--panel-top,185px) + 66px);width:var(--panel-w,440px);box-sizing:border-box;padding:0 16px;max-height:calc(var(--panel-h,340px) - 78px);overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;
  /* 底部渐隐：滚动边界处的半行不再是"被切断"，而是"还有内容"的有意视觉语言 */
  padding-bottom:16px;
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 16px),transparent 100%);
  mask-image:linear-gradient(to bottom,#000 calc(100% - 16px),transparent 100%)}   /* 内容上界跟随黑板高度；超出走内部滚动，绝不溢到黑板外 */
#v2panel .ph2{height:13px;line-height:13px;font:400 8.5px/1 ui-monospace,Consolas,monospace;color:var(--ink);letter-spacing:1.4px}
#v2panel .ph2 .he{float:right;letter-spacing:0}
#v2panel .sess{margin-top:5px}
#v2panel .srow{height:15px;line-height:15px;font-size:10.5px;color:var(--ink4);white-space:nowrap;overflow:hidden}
#v2panel .srow .agg{float:right;font:400 9px/15px ui-monospace,Consolas,monospace;color:var(--ink3)}
#v2panel .plan{font:400 8.5px/12px ui-monospace,Consolas,monospace;color:#ffc266;height:12px;white-space:nowrap;overflow:hidden}
/* 子代理树：缩进 + 连接线 + 状态图标 */
#v2panel .tree2{margin-top:6px}
#v2panel .trow{position:relative;height:19px;line-height:19px;font-size:10.5px;white-space:nowrap;overflow:hidden;
  transition:opacity .12s linear}
#v2panel .trow.root{color:var(--ink5);font-weight:600}
#v2panel .trow .tw{color:var(--ink3);font-family:ui-monospace,Consolas,monospace}
#v2panel .trow .ar{display:inline-block;width:10px;color:var(--ink);font-size:9px}
#v2panel .trow .tail{float:right;font:400 8.5px/19px ui-monospace,Consolas,monospace;color:var(--ink);margin-left:8px}
#v2panel .trow .ic{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:7px;vertical-align:0}
#v2panel .trow .ic.run{background:#56d9c8}
#v2panel .trow .ic.done{background:#7fe3c8}
#v2panel .trow .ic.failed{background:#ff8f7a}
#v2panel .trow .ic.stopped,#v2panel .trow .ic.unknown,#v2panel .trow .ic.wait{background:none;border:1.3px solid #a8bdd2}
#v2panel .trow.hot{background:rgba(86,217,200,.10);border-radius:3px}
#v2panel .trow.hot::before{content:'';position:absolute;left:-6px;top:2px;bottom:2px;width:2px;background:#56d9c8;border-radius:1px}
#v2panel .fold{height:15px;line-height:15px;font:400 8.5px/15px ui-monospace,Consolas,monospace;color:var(--ink)}
#v2panel .foot{margin-top:6px;padding-top:5px;border-top:1px solid rgba(157,196,230,.16);
  font:400 8.5px/1.5 ui-monospace,Consolas,monospace;color:var(--ink);white-space:normal}
/* ===== 三档剖面：只动 transform / opacity / background-position ===== */
.tier-eco .anim{animation:none !important}
.tier-standard .anim{animation-duration:6s}

@keyframes v2spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

.v2scan{background-image:repeating-linear-gradient(90deg,rgba(232,244,252,.55) 0 6px,rgba(232,244,252,0) 6px 9px);
  animation:v2scan 2.2s linear infinite}

<div id="v2hover" class="plate"></div>
<div id="v2panel"></div>
<div id="panel"><svg id="leads" viewBox="0 0 440 525" width="100%" height="100%"></svg>
  <div id="plate"><svg class="pg" id="plateBg" width="440" height="340" viewBox="0 0 440 340"></svg>
    <div class="sheen"></div><div class="scan"></div><div id="pIn"><div id="plateInner"></div></div></div></div>
<div id="stage">
  <div id="zoom">
    <div id="shk">
      <svg id="ico" class="st-IDLE" viewBox="0 0 200 200" width="144" height="144"
           preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- L1 底盘渐变（固定色，不随状态变；SPEC 第 2 节） -->
          <radialGradient id="plateGrad">
            <stop offset="0%" stop-color="#050809" stop-opacity=".86"/>

            <stop offset="100%" stop-color="#050809" stop-opacity="0"/>
          </radialGradient>

          <!-- L6 核心辉光的高斯模糊（SPEC 第 2 节：模糊 11）；两个呼吸档来自黄金样本实体尺寸 6px/20px -->
          <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="11"/></filter>
          <filter id="soft2b" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
          <filter id="soft4b" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
          <!-- 视觉基准：temp4/hybrid.html 的 <symbol id="base-h2">，几何一字未改 -->
          <g id="base-h2">
            <circle class="plate" cx="100" cy="100" r="97" fill="url(#plateGrad)"/>
            <circle class="tick" cx="100" cy="100" r="94" fill="none" stroke="var(--c2)"
                    stroke-width="1" stroke-dasharray="1.5 7"/>
            <!-- 进度环（v2）：r=88 夹在 tick 环(94) 与分段弧(60) 之间；无计划时整条不画 -->
            <circle class="progRing" cx="100" cy="100" r="88" fill="none" stroke="#56d9c8" stroke-width="3.5"
                    stroke-linecap="round" transform="rotate(-90 100 100)"
                    stroke-dasharray="0 552.9" opacity="0" style="transition:stroke-dasharray .35s linear,opacity .3s linear"/>
            <g class="cloud"></g>

              <circle cx="100" cy="100" r="60" fill="none" stroke="var(--c1)" stroke-width="2"
                      stroke-dasharray="40 16 8 16" stroke-linecap="round"/>
            </g>
            <circle class="inner" cx="100" cy="100" r="48" fill="none" stroke="var(--c2)" stroke-width="1"/>
            <circle class="glow glowA" cx="100" cy="100" r="44" fill="var(--c1)" opacity="calc(var(--core) * .2)"/>
            <circle class="glow glowB" cx="100" cy="100" r="44" fill="var(--c1)" opacity="0"/>
            <!-- SUCCESS 的扩散环：按黄金样本的叠放次序，夹在辉光与核心之间 -->
            <circle class="burst" cx="100" cy="100" r="34" fill="none" stroke="var(--c1)" stroke-width="2" opacity="0"/>
            <g class="core">
              <path d="M100 70 L126 116 L74 116 Z" fill="none" stroke="var(--c1)" stroke-width="2.6"
                    stroke-linejoin="round" opacity="var(--core)"/>

  <div id="lab2"></div>
</div>
<script>
'use strict'
/* ==========================================================================
   H2「等离云核」渲染器
   视觉资产来源：temp4/hybrid.html 的 <symbol id="base-h2"> / halo() / .st-* 变量
   常量来源    ：docs/SPEC-H2.md 第 2/3/4 节 + golden/h2-golden.html（黄金样本同源实现）
   ========================================================================== */
var NS = 'http://www.w3.org/2000/svg'
/* 没有 preload 桥时（例如用普通浏览器打开本页面做像素比对）退化成空实现，绝不因为桥缺失而整页白屏。
   注意：Electron 里 contextBridge 暴露的 window.dsh 是只读属性，不能回写，否则渲染层直接抛错白屏。 */
var BRIDGE = window.dsh
if (!BRIDGE) {
  BRIDGE = {
    onMessage: function () {}, dragBy: function () {}, dragEnd: function () {}, activate: function () {},
    menu: function () {}, painted: function () {}, fps: function () {}, log: function () {},
    treeRows: function () {}, panelHitRect: function () {}
  }
}
var Q = new URLSearchParams(location.search)
var STATES = ['IDLE','THINKING','WORKING','WAITING','SUCCESS','ERROR','DISCONNECTED']
/* 黄金样本沿用 SPEC 的短名（粒子种子依赖它，必须一致） */
var GKEY = { IDLE:'IDLE', THINKING:'THINK', WORKING:'WORK', WAITING:'WAIT',
             SUCCESS:'OK', ERROR:'ERR', DISCONNECTED:'OFF' }
/* SPEC 第 3 节：粒子数 / 半径带 */
var PT = { IDLE:{n:36,R:[80,96]}, THINK:{n:62,R:[76,94]}, WORK:{n:98,R:[72,92]}, WAIT:{n:52,R:[80,97]},
           OK:{n:98,R:[72,92]}, ERR:{n:98,R:[72,92]}, OFF:{n:36,R:[80,96]} }
var LAB = { IDLE:'空闲', THINKING:'思考中', WORKING:'执行中', WAITING:'待确认',
            SUCCESS:'完成', ERROR:'出错', DISCONNECTED:'离线' }
var ACT = { searching:'搜索', editing:'编辑', testing:'测试', commanding:'命令' }

/* ---------- 确定性伪随机 + halo()：与 hybrid.html / 黄金样本同源 ---------- */
function makeRnd (seed) { var s = seed >>> 0 || 1; return function () { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff } }
function halo (rnd, R) {
  var u = rnd() * 2 - 1, th = rnd() * Math.PI * 2, s = Math.sqrt(1 - u * u)
  var rad = R[0] + rnd() * (R[1] - R[0])
  return { x: 100 + rad * s * Math.cos(th), y: 100 + rad * u * 0.94, z: (Math.sin(th) * s + 1) / 2 }
}

var stage = document.getElementById('stage')
var ico = document.getElementById('ico')
var lab = document.getElementById('lab')
var lab2 = document.getElementById('lab2')
var layersRoot = document.getElementById('layers')
var base = document.getElementById('base-h2')

/* 被渲染的进度环：base-h2 是 <defs> 里的模板 —— defs 内容**永不绘制**，且七个状态层
   各 cloneNode(true) 复制 base.children 时会把 id 一起复制。 ⇒ 文档里共有 8 个
   同名 id 的圆（1 个 defs 母本 + 7 个可见克隆），getElementById 只能取到文档序

function setRot (layer, deg) {
  var seg = layer.querySelector('.seg')
  if (seg) seg.style.transform = deg ? ('rotate(' + deg.toFixed(2) + 'deg)') : ''
  var lanes = layer.querySelectorAll('.cloud > .lane')
  if (!motionOn()) {
    /* 省电档：**退回改动前的整片刚性旋转** —— transform 挂在 .cloud 上（1 个合成层），
       4 条车道不挂任何 transform。这样省电档的 DOM/变换与改动前逐字节等价，
       既不更"活"也不更贵（实测 saver 档 IDLE 的 CPU 就是靠这一条回到基线量级）。 */
    var cl = layer.querySelector('.cloud')
    if (cl) cl.style.transform = deg ? ('rotate(' + deg.toFixed(2) + 'deg)') : ''
    for (var j = 0; j < lanes.length; j++) lanes[j].style.transform = ''
    return
  }
  var c2 = layer.querySelector('.cloud')
  if (c2) c2.style.transform = ''      /* 有 per-lane 运动时 .cloud 不自己转（否则叠加成双倍角速度） */
  for (var i = 0; i < lanes.length; i++) {
    var a = deg * LANE_MOTION[i % LANE_MOTION.length].s
    lanes[i].style.transform = a ? ('rotate(' + a.toFixed(2) + 'deg)') : ''
  }
}
/* 车道运动表 → 一行机器可读留痕（tests/particle-motion.mjs 吃它）：速度范围/方向/反向占比/半径波动幅度与周期 */
function logMotion () {
  var pt = PT[GKEY[cur]] || { R: [0, 0] }
  var sp = [], cnt = [], wob = []
  for (var i = 0; i < LANE_N; i++) {
    var m = LANE_MOTION[i % LANE_MOTION.length]
    sp.push(m.s.toFixed(2))
    wob.push(LANE_WOB_U[i % LANE_WOB_U.length].toFixed(2))
    var ls = LANES[cur] ? LANES[cur][i] : null
    cnt.push(ls ? ls.childNodes.length : 0)
  }
  var rev = 0, tot = 0
  for (var k = 0; k < cnt.length; k++) { tot += cnt[k]; if (LANE_MOTION[k % LANE_MOTION.length].s < 0) rev += cnt[k] }
  /* 该状态的基础角速度 → 每条车道的半径波动周期 = 该车道自己的旋转周期（=|SPIN|/|s| 秒） */
  var per = LANE_MOTION.map(function (m) { return Math.round(Math.abs(SPIN[cur] || 0) / Math.abs(m.s) * 1000) })
  BRIDGE.log('motion: on=' + (motionOn() ? '1' : '0') + ' eco=' + (((typeof V2PROFILE !== 'undefined' && V2PROFILE === 'eco') || (FPS_BUDGET && FPS_BUDGET.power === 'saver')) ? '1' : '0') +
    ' lanes=' + LANE_N + ' speeds=' + sp.join(',') + ' dirs=' + LANE_MOTION.map(function (m) { return m.s < 0 ? -1 : 1 }).join(',') +
    ' wobAmp=' + wob.join(',') + ' periods=' + per.join(',') + ' particles=' + cnt.join(',') +
    ' reverseShare=' + (tot ? (rev / tot).toFixed(3) : '0') + ' wobU=' + Math.min.apply(null, LANE_WOB_U).toFixed(2) + '~' + WOB_U_MAX.toFixed(2) +
    ' wobOn=' + (motionOn() ? 'lane-orbit' : 'off') + ' band=' + pt.R[0] + ',' + pt.R[1] + ' state=' + cur)
}
function setCore (layer, op) {
  var k = layer.querySelectorAll('.core > *')
  for (var i = 0; i < k.length; i++) k[i].setAttribute('opacity', op.toFixed(3))
}
function step () {
  var st = cur, layer = LAYER[st]
  if (!layer) return
  var core = CORE[st], t = A.t
  /* L3 云 + L4 分段环旋转（SPEC 第 3 节角速度） */
  setRot(layer, A.angle)
  /* 待确认：整图 1.9s 呼吸（辉光模糊 6px ↔ 20px 档，用两颗预算模糊的辉光交叉淡化 + 核心同相呼吸） */
  if (st === 'WAITING') {
    var ph = 0.5 - 0.5 * Math.cos(2 * Math.PI * t / 1900)
    var g = core * (0.2 + 0.8 * ph)
    layer.querySelector('.glowA').setAttribute('opacity', (ph < 0.5 ? g : 0).toFixed(3))
    layer.querySelector('.glowB').setAttribute('opacity', (ph >= 0.5 ? g : 0).toFixed(3))
    setCore(layer, Math.min(1, core * (0.82 + 0.18 * ph)))
  } else if (st === 'THINKING') {
    var ph2 = 0.5 - 0.5 * Math.cos(2 * Math.PI * t / 3000)
    setCore(layer, Math.min(1, core * (0.94 + 0.06 * ph2)))
  }
  /* 完成：一次性白光闪 + 一圈扩散环（1.2s），状态回落由宿主负责 */
  if (st === 'SUCCESS') {
    /* 完成相位（循环内 burstT 时间轴）：收束 0~38% → 爆散 38~100% → 回归，总 ~1s。
       用 r 表达 scale（不用 transform：SVG transform 属性与 CSS transform-origin 会叠成双轴心）。 */
    var ft = (V2.freezeBurst === 'tight') ? 300 : (V2.freezeBurst === 'out' ? 700 : t)   /* 冻结通道：固定 t 抓两帧 */
    var bt = Math.min(1, ft / 1000)
    var pr8s = progRings()          /* 全部被渲染的克隆；pr8 只用于"有没有计划"与相位留痕 */
    var pr8 = pr8s.length ? pr8s[0] : null
    if (pr8 && pr8.getAttribute('opacity') !== '0') {   /* 没计划时环本来是隐藏的，不参与 */
      var k = bt < 0.38 ? (1 - 0.07 * (bt / 0.38)) : (0.93 + 0.33 * ((bt - 0.38) / 0.62))   /* 收束→爆散 */
      var rr = 88 * k
      var _sw = (bt < 0.38 ? (3.5 + 2.5 * (bt / 0.38)) : (6 - 4.4 * ((bt - 0.38) / 0.62))).toFixed(2)
      var _op = bt > 0.38 ? (0.95 - 0.4 * ((bt - 0.38) / 0.62)).toFixed(3) : null
      /* dasharray 要跟着半径重算，否则完成度比例会漂 */
      var dash = pr8.getAttribute('stroke-dasharray') || ''
      var parts = dash.split(' ')
      var _nd = null
      if (parts.length === 2 && Number(parts[0]) > 0) {
        var fr = Number(parts[0]) / (2 * Math.PI * 88)      /* 原完成度（按 r=88 算的） */
        var C2 = 2 * Math.PI * rr
        _nd = (C2 * fr).toFixed(1) + ' ' + C2.toFixed(1)
      }
      for (var _i = 0; _i < pr8s.length; _i++) {           /* 逐个克隆写：少写一个就有一层状态不显示环 */
        pr8s[_i].setAttribute('r', rr.toFixed(2))
        pr8s[_i].setAttribute('stroke-width', _sw)
        if (_op !== null) pr8s[_i].setAttribute('opacity', _op)
        if (_nd !== null) pr8s[_i].setAttribute('stroke-dasharray', _nd)
      }
    }
    /* 辉光铺开 + 核心胀大（爆散期） */
    var gA = layer.querySelector('.glowA'), gB = layer.querySelector('.glowB')
    var gb = bt < 0.38 ? (0.2 + 0.5 * (bt / 0.38)) : (0.7 + 0.45 * ((bt - 0.38) / 0.62))
    if (gA) gA.setAttribute('opacity', Math.min(1, core * gb).toFixed(3))
    if (gB) gB.setAttribute('opacity', (bt < 0.38 ? 0 : Math.min(1, core * (gb - 0.7) * 2)).toFixed(3))
    var bp = Math.min(1, ft / 1200)
    var ring = layer.querySelector('.burst')
    ring.setAttribute('r', (34 + 62 * bp).toFixed(2))
    ring.setAttribute('stroke-width', (2 * (1 - 0.7 * bp)).toFixed(2))
    ring.setAttribute('opacity', (0.9 * (1 - bp)).toFixed(3))
    var fl = document.getElementById('flash')
    fl.setAttribute('opacity', ft < 240 ? (0.6 * Math.sin(Math.PI * ft / 240)).toFixed(3) : '0')
    setCore(layer, bt < 0.15 ? Math.min(1, core * (1 + 0.35 * Math.sin(Math.PI * bt / 0.15))) : (bt > 0.9 ? core * 0.9 : core))
    /* 相位留痕（每相位只打一次，供断言） */
    var phName = bt < 0.38 ? '收束' : '爆散'
    if (A.burstPhase !== phName) { A.burstPhase = phName; BRIDGE.log('burst(loop): ' + phName + ' bt=' + bt.toFixed(2) + ' r=' + (pr8 ? pr8.getAttribute('r') : 'n/a')) }
  } else if (A.burstPhase) { A.burstPhase = ''; BRIDGE.log('burst(loop): 回归（非完成态）') }
  /* 出错：核心左右抖动 3 次（每次 ±2px / 80ms），之后停住 */
  if (st === 'ERROR') {
    var idx = Math.floor(t / 80)
    var dx = idx < SHAKE.length ? SHAKE[idx] * 2 : 0
    var cg = layer.querySelector('.core')
    if (dx) cg.setAttribute('transform', 'translate(' + dx + ' 0)')
    else cg.removeAttribute('transform')
  }
}

/* ---------- 主进程下发的窗口几何 ---------- */
function applyMetrics (m) {
  ico.setAttribute('width', String(m.svgSize))
  ico.setAttribute('height', String(m.svgSize))
  document.body.style.opacity = String(m.opacity / 100)
}

/* ---------- 与主进程通讯 ---------- */
BRIDGE.onMessage(function (msg) {
  if (!msg || typeof msg.kind !== 'string') return
  if (msg.kind === 'state') applyState(msg.state, msg)
  else if (msg.kind === 'metrics') applyMetrics(msg)
  else if (msg.kind === 'panel') { setPanel(!!msg.open, msg) }
  else if (msg.kind === 'test-mouse') { runMouseSeq(msg.spec) }
  else if (msg.kind === 'test-hover') { setHot(!!msg.on) }
  else if (msg.kind === 'fps') { var fb = applyFpsBudget(msg.value); BRIDGE.log('fps-config -> ' + JSON.stringify(fb)) }
  else if (msg.kind === 'hot') setHot(msg.inside)
})

/* ---------- 鼠标手势：**单击留给拖动，双击开关大面板**（用户 2026-09-12 定的模型）
   用户的原话洞察：在可拖动元素上，单击本身就是有歧义的（点击 vs 拖动起点），
   所以开关类操作交给双击，把单击完整地留给拖动。

   判据（与 tests/panel-toggle.mjs 一一对应，改这里就要同步改测试）：
     · 一次「点击」= 按下到抬起**累计位移 ≤ CLICK_PX(4)** 且 **时长 < CLICK_MS(500)**
     · 两次「点击」间隔 ≤ DBL_MS(350) → 双击 → 切面板；否则只发 activate（单击不做别的）
     · 一旦累计位移 > CLICK_PX（即真拖动）：**立即清空双击计时** —— 拖完不会被算成双击的前半段，
       也不会把"拖一下"累积进去
     · 拖动本身的语义完全不变：任何非零位移都立刻 dragBy（不设死区，避免手感变钝），
       抬起时位移 > CLICK_PX → dragEnd（只有它会写位置记忆）                      */
var CLICK_PX = 4, CLICK_MS = 500, DBL_MS = 350
var dstate = { down: false, moved: 0, lx: 0, ly: 0, t0: 0, moves: 0 }
var lastClickAt = 0
/* ------------------------------------------------------------------ 面板滚动条手势（2026-09-13）
   面板现在是可交互的（窗口侧判据 = 图标圆 ∪ 面板可见矩形），所以 #v2panel 右侧那条滚动条
   必须能真的拖动。滚动条是**浏览器内部**画的，窗口里没有它的 DOM ⇒ 用几何判据：
   指针落在 (#v2panel 内容盒右缘 → 边框盒右缘) 这一列里，就是"冲着滚动条去的"。
   这时**不能让 #stage 的拖动逻辑把窗口拖走**（否则一拖滚动条，图标就跟着跑），
   而是把整段 mousedown/mousemove/mouseup 原样留给 Chromium 的原生滚动条处理。
   这是纯读判定 + 事件放行，**不合成任何输入**。 */
var IS_SCROLL = false
function scrollbarHit (cx, cy) {
  var el = document.getElementById('v2panel')
  if (!el || !panelOpen) return null
  var r = el.getBoundingClientRect()
  /* client 左缘 = 边框 + 左内边距；内容盒右缘 = 边框盒右缘 - 滚动条宽。
     scrollbar-width:thin 下 (offsetWidth - clientWidth) 就是滚动条占的像素（实测 10）。 */
  var sbw = el.offsetWidth - el.clientWidth
  var contentRight = r.right - sbw
  var byGeo = sbw >= 4 && cx >= contentRight - 1 && cx <= r.right + 1 && cy >= r.top && cy <= r.bottom
  /* 几何判据为主；再用 elementFromPoint 做一次交叉验证（滚动条是 UA 影子内容，
     命中它会返回容器自身）—— 两者取并集，避免把纯几何的边界算错。 */
  var hit = byGeo
  var byEl = false
  try {
    if (!hit) {
      var at = document.elementFromPoint(cx, cy)
      byEl = !!at && (at === el || el.contains(at))
      hit = byEl
    }
  } catch (e) { /* ignore */ }
  return { hit: hit, geo: byGeo, byEl: byEl, top: Math.round(r.top), bottom: Math.round(r.bottom), left: Math.round(r.left), right: Math.round(r.right), contentRight: Math.round(contentRight), sbw: sbw }
}

function hDown (x, y, cx, cy) {
  dstate.down = true; dstate.moved = 0; dstate.moves = 0
  dstate.lx = x; dstate.ly = y; dstate.t0 = Date.now()
  var sb = scrollbarHit(cx, cy)
  IS_SCROLL = !!(sb && sb.hit)
  BRIDGE.log('mousedown screen=' + x + ',' + y + ' client=' + cx + ',' + cy +
    ' scrollbar-hit=' + IS_SCROLL + (sb ? ' contentRight=' + sb.contentRight + ' sbw=' + sb.sbw : ''))
}
function hMove (x, y, mx, my) {
  if (!dstate.down) return
  if (IS_SCROLL) return       /* 滚动条手势：位移留给 Chromium 原生滚动条，绝不当成拖窗口 */
  dstate.moves++
  var dx = Math.round(x - dstate.lx), dy = Math.round(y - dstate.ly)
  if (dstate.moves <= 3 || (!dx && !dy && dstate.moves < 6)) {
    BRIDGE.log('mousemove#' + dstate.moves + ' screen=' + x + ',' + y + ' movement=' + mx + ',' + my + ' delta=' + dx + ',' + dy)
  }
  if (!dx && !dy) { dx = Math.round(mx || 0); dy = Math.round(my || 0) }
  if (dx || dy) {
    dstate.lx = x; dstate.ly = y
    dstate.moved += Math.abs(dx) + Math.abs(dy)
    if (dstate.moved > CLICK_PX) lastClickAt = 0      /* 真拖动 ⇒ 双击计时作废 */
    BRIDGE.dragBy(dx, dy)                             /* 拖动语义与改动前逐字一致 */
  }
}
function hUp () {
  if (!dstate.down) return
  dstate.down = false
  if (IS_SCROLL) {
    /* 滚动条手势收尾：不 activate、不 dragEnd（位置记忆不被污染） */
    BRIDGE.log('mouseup scrollbar-drag-end moved=' + dstate.moved + ' moves=' + dstate.moves)
    IS_SCROLL = false
    return
  }
  var dt = Date.now() - dstate.t0
  BRIDGE.log('mouseup moved=' + dstate.moved + ' moves=' + dstate.moves + ' dt=' + dt)
  if (dstate.moved <= CLICK_PX && dt < CLICK_MS) {
    BRIDGE.activate()                                 /* 单击：只做"人处理了"的确认（ERROR 态），不聚焦、不切面板 */
    var now = Date.now()
    if (now - lastClickAt <= DBL_MS) { lastClickAt = 0; BRIDGE.log('double-click -> toggle panel'); BRIDGE.togglePanel() }
    else lastClickAt = now
  } else {
    BRIDGE.dragEnd()                                  /* 只有真正的拖动才结束拖动（写位置记忆） */
  }
}
stage.addEventListener('mousedown', function (e) {
  if (e.button !== 0) return
  hDown(e.screenX, e.screenY, e.clientX, e.clientY)
})
window.addEventListener('mousemove', function (e) { hMove(e.screenX, e.screenY, e.movementX, e.movementY) })
window.addEventListener('mouseup', function () { hUp() })

/* 离屏测试钩子：灌一段"鼠标脚本"走**同一套** hDown/hMove/hUp（不合成任何真实输入）
   格式 "间隔ms|d,x,y;m,x,y;u,x,y|d,x,y;m,x,y;u,x,y" */
function runMouseSeq (spec) {
  var parts = String(spec).split('|')
  var gap = Math.max(0, Number(parts[0]) || 160)
  var segs = parts.slice(1), i = 0
  function step () {
    if (i >= segs.length) { BRIDGE.log('test-mouse done segs=' + segs.length); return }
    var frames = segs[i++].split(';')
    for (var j = 0; j < frames.length; j++) {
      var f = frames[j].split(','), op = f[0]
      if (op === 'd') hDown(+f[1], +f[2], +f[1], +f[2])
      else if (op === 'm') hMove(+f[1], +f[2], 0, 0)
      else if (op === 'u') hUp()
    }
    setTimeout(step, gap)
  }
  step()
}

/* ================= 完整面板（③-2 定稿）=================
   2026-09-12 定稿：**440 宽 / 底板 α 0.78**（α 由主进程 PANEL_ALPHA 下发，将来做成 window.panelAlpha）。
   ⚠️ α 0.78 的代价（实测）：浅色壁纸下明细行 3.5:1、微标签 3.3:1（低于 AA 4.5）；深色/蓝调壁纸全绿。
      用户已知情接受，因为将来可自行调。
   数据：宿主协议 v2 还没落地，这里先用**示例内容**；接数据时把宿主载荷塞进 panelData 再 renderPanel()。 */
var PANEL = { w: 440, h: 340, top: 185, alpha: 0.78 }
var panelOpen = false
var PC = { act: '#56d9c8', money: '#ffc266', metric: '#9ad4ff', think: '#9fb0c4', task: '#b79cff', ink: '#e8f0fa', dim: '#98b0c6' }
/* 分区色的「**文字档**」（2026-09-13 用户拍板：提亮到达标）。
   口径：**色相不变、只提亮度** —— 8.5~10.5px 小字要在浅色壁纸的最亮边界上过 4.5:1。
   只有**当文字色用**的地方取它；PC 里的原值继续供**图形与装饰**使用（一个字节都不动）：
   .live i 圆点、.v2ruler i.on 刻度、.v2bullet .bs、.trow .ic.run 状态点、.trow.hot::before 竖条、
   progRing / .seg 的 stroke、以及 .sec 的 border-left-color。
   `metric`（淡蓝=度量数值）本身**只当文字色用**（只被 metric() 取），所以直接存提亮值。 */
var PTEXT = { '#56d9c8': '#7fe3c8' }
/* 真实数据（宿主 v2 载荷）。**禁止示例数据**：没有真实来源的字段一律不画。
   历史：v2 未落地前这里曾是示例内容；现已接真数据 —— 假数据与真数据同屏会误导判断。 */
var panelData = null
function fmtDur (ms) {
  if (typeof ms !== 'number' || !isFinite(ms) || ms < 0) return '\u2014'
  var s = Math.round(ms / 1000)
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0')
}
function panelDataFromV2 () {
  var pr = V2.progress, m = V2.metrics, sa = V2.subagents, tk = V2.tokens
  var td = V2.todos, ct = V2.context, co = V2.cost, tx = V2.text
  var items = (td && Array.isArray(td.items)) ? td.items : []
  var elapsed = (m && typeof m.elapsedMs === 'number') ? m.elapsedMs : null
  var turns = (m && typeof m.turns === 'number') ? m.turns : null
  var costOk = !!(co && co.status === 'ok' && co.cost && typeof co.cost.CNY === 'number')
  return {
    hasData: !!(pr || m || sa || tk || td || ct || co || tx),
    action: (typeof V2.activity === 'string' && V2.activity) ? V2.activity : '\u2014',
    stateText: V2.stateName ? (LAB[V2.stateName] || V2.stateName) : '\u2014',
    elapsed: fmtDur(elapsed), step: turns === null ? '\u2014' : String(turns),
    avg: (elapsed && turns) ? (elapsed / 1000 / turns).toFixed(1) : '\u2014',
    think: [tx && tx.thoughtTail, tx && tx.bodyTail].filter(Boolean),
    /* 花费：只有宿主显式给了 ok + 金额才显示；否则 unavail=true（不画 ¥0.00） */
    cost: costOk ? co.cost.CNY.toFixed(2) : null,
    unavail: !!co && !costOk,
    unpriced: (co && typeof co.unpriced === 'number') ? co.unpriced : 0,
    tokIn: (tk && typeof tk.input === 'number') ? +(tk.input / 1000).toFixed(1) : null,
    tokOut: (tk && typeof tk.output === 'number') ? +(tk.output / 1000).toFixed(1) : null,
    tokAll: (tk && typeof tk.total === 'number') ? +(tk.total / 1000).toFixed(1) : null,
    ctx: (ct && ct.applicable === true && typeof ct.ratio === 'number') ? Math.max(0, Math.min(1, ct.ratio)) : null,
    ctxText: (ct && ct.applicable === true && typeof ct.ratio === 'number') ? (Math.round(ct.ratio * 1000) / 10 + '%') : null,
    ctxUsed: (ct && ct.applicable === true && typeof ct.used === 'number' && typeof ct.limit === 'number') ? (ct.used + ' / ' + ct.limit) : null,
    subs: (sa && typeof sa.running === 'number') ? (sa.running + (typeof sa.total === 'number' ? ' / ' + sa.total : '')) : null,
    subsP: (sa && typeof sa.total === 'number' && sa.total > 0) ? Math.max(0, Math.min(1, sa.done / sa.total)) : null,
    tasks: items.slice(0, 6).map(function (it, i) {
      var k = it.status === 'done' ? 'done' : it.status === 'in_progress' ? 'doing' : 'todo'
      return [String(i + 1).padStart(2, '0'), k, it.content || '\u2014']
    }),
    progress: (pr && pr.applicable === true && typeof pr.total === 'number' && pr.total > 0) ? (pr.done / pr.total) : null,
    progText: (pr && pr.applicable === true && typeof pr.done === 'number' && typeof pr.total === 'number') ? (pr.done + ' / ' + pr.total + (pr.inProgress ? ' 跑着 ' + pr.inProgress : '')) : null

/* 取色测试用：把壁纸铺在窗口底下，量「半透明黑板 α 叠在浅色壁纸之上」的**真实合成对比度**。

   而 main.js 的 loadFile 只转发一份固定白名单查询参数（state/svg/pad/opacity/scale/shot/bg/fps/spin/hide），

<script>
/* ======================================================================
   取色探针（?probe=1）：面板/黑板上**每一个可见文字元素**的实测几何 + 计算样式
   —— 只读、只打日志，不改任何视觉。

   为什么要它：对比度是"文字色 × 该元素矩形内**合成后**的真实背景"的函数，
   而合成结果里含半透明黑板 α、四段渐变、22px 网格、斜高光，以及底下的壁纸，
   靠读 CSS 手算必然出错（同一类 bug 已经靠"读代码推断"漏过一次：只修了 .trow2 .tw）。
   所以这里把**测量所需的输入全部打印出来**，由测试侧解 PNG 取真实背景再算 WCAG。

   ★ 测量口径必须与产品一致：`panel plate(tag)` 打印的**同一个矩形**（即 #plate 的
     bounding rect，带 4px 内缩）作为"整块背景"取值窗口；#v2panel 只约束内容，
     不是背景层（#v2panel 自身没有 background）。实现在 tests/v2.mjs 里。
   ====================================================================== */
var __PROBE_ON = String(Q.get('hide') || '').indexOf('hex=') === 0   /* 见下方 hide 通道说明：取色跑必开 */
var __PROBE_SEL = '#plateInner .ph,#plateInner .tl,#plateInner .sh,#plateInner .sh .sl,#plateInner .sh .sr,' +
  '#plateInner .t1,#plateInner .mt .ml,#plateInner .mt .mv,#plateInner .mt .mu,#plateInner .ebig,#plateInner .esub,' +
  '#plateInner .esub2,#plateInner .slab,#plateInner .tstrip,#plateInner .tkrow,' +
  '#v2panel .ph2,#v2panel .sh,#v2panel .mt,#v2panel .trow .tt,#v2panel .trow .mk,#v2panel .trow .tw,' +
  '#v2panel .trow .ar,#v2panel .trow .tail,#v2panel .trow2 .tt,#v2panel .trow2 .mk,#v2panel .trow2 .tw,' +
  '#v2panel .tx,#v2panel .srow,#v2panel .srow .agg,#v2panel .fold,#v2panel .plan,#v2panel .foot,#v2panel .cwlab'
function __probeSkip (el) {
  /* 只量**真正上色且承载文字**的叶子元素：
     ① 有元素子节点的容器（.v2sec / .trow / .trow.root / .mt）自身不含独立颜色，
        量它既会得到容器的继承色、又会与子块重复计一次（面板里的 .v2sec 比它的文字高几十 px）；
     ② 纯装饰符号（树形引导符 '└' / 组间的 '·'）不承载信息，不进对比度断言。 */
  for (var i = 0; i < el.children.length; i++) {
    if ((el.children[i].textContent || '').trim()) return true
  }
  var txt = (el.textContent || '').replace(/\s+/g, ' ').trim()

  return !/[0-9A-Za-z\u4e00-\u9fff]/.test(txt)

window.__probePanel = function (tag) {
  var t = tag || 'probe'
  var out = []
  Array.prototype.forEach.call(document.querySelectorAll(__PROBE_SEL), function (el) {
    if (__probeSkip(el)) return
    var r = el.getBoundingClientRect()
    if (r.width < 1 || r.height < 1) return
    var cs = window.getComputedStyle(el)

    var par = el.parentElement
    var cls = '.' + String(el.className || '').trim().split(/\s+/)[0]

      Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height),
      cs.color, parseFloat(cs.fontSize), cs.fontWeight, cs.fontStyle,
      el.tagName.toLowerCase(), cls,
      cs.backgroundColor === 'rgba(0, 0, 0, 0)' ? 'none' : cs.backgroundColor,
      par ? par.className : ''].join('|'))

  /* 逐轮都打会让日志被同一份清单刷屏 ⇒ 只在**清单内容变了**时才留痕（仍然不漏掉任何一次变化） */
  var sig = out.join(' ; ')
  if (sig === window.__probeSig) return
  window.__probeSig = sig
  BRIDGE.log('panel probe(' + t + ') n=' + out.length + ' :: ' + sig)
}
/* 取色测试还要知道"当轮真实生效的壁纸"与"面板几何"，便于把对比度归因到确定的背景。
   ⚠️ 这一行**必须门控**：它是本 script 块的**顶层语句**，不门控就会在**每次窗口加载**（含生产路径、
   宿主零参数 spawn）往 helper.log 写一行 —— 那就等于把未完成的调试机制带上生产。
   __PROBE_ON（L1542，由 hide=hex= 通道门控）在同一 script 块内已赋值，可直接用。 */
if (__PROBE_ON) BRIDGE.log('probe ready wp=' + (window.__wpApplied ? 'yes' : 'no') + ' dpr=' + (window.devicePixelRatio || 1))
/* 不再用启动定时器探针：数据是异步喂进来的，早打印会得到 0 块（等于什么都没测）。
   真正的触发点在 logPanelLayout() 里，紧跟该轮 panel blocks 之后。 */
</script>
